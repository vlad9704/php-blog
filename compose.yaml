services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - smarty_data:/app/var
    environment:
      DB_HOST: db
      DB_NAME: blog
      DB_USER: blog
      DB_PASSWORD: blog
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: blog
      MYSQL_USER: blog
      MYSQL_PASSWORD: blog
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  assets:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    profiles:
      - tools

volumes:
  mysql_data:
  smarty_data: